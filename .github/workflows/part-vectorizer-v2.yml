name: Part Vectorizer v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/part-vectorizer-v2/**'
      - '.github/workflows/part-vectorizer-v2.yml'
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Optional repository-relative manifest to vectorize after self-tests'
        required: false
        type: string
        default: ''
      fast:
        description: 'Use one balanced VTracer profile instead of the 3-profile quality sweep'
        required: false
        type: boolean
        default: false
      no_fail:
        description: 'Produce audits even when a requested sheet misses quality gates'
        required: false
        type: boolean
        default: false

jobs:
  vectorizer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Restore quality-locked vectorizer cache
        uses: actions/cache@v4
        with:
          path: tools/part-vectorizer-v2/.cache
          key: vectorizer-v3-${{ runner.os }}-${{ hashFiles('tools/part-vectorizer-v2/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            vectorizer-v3-${{ runner.os }}-${{ hashFiles('tools/part-vectorizer-v2/package-lock.json') }}-
            vectorizer-v3-${{ runner.os }}-
      - name: Install vectorizer dependencies
        working-directory: tools/part-vectorizer-v2
        run: npm install
      - name: Run parser and end-to-end vectorizer tests
        working-directory: tools/part-vectorizer-v2
        run: npm test
      - name: Vectorize requested authoring sheet
        if: github.event_name == 'workflow_dispatch' && inputs.manifest_path != ''
        shell: bash
        run: |
          EXTRA=()
          if [ "${{ inputs.fast }}" = "true" ]; then EXTRA+=(--fast); fi
          if [ "${{ inputs.no_fail }}" = "true" ]; then EXTRA+=(--no-fail); fi
          node tools/part-vectorizer-v2/cli.mjs \
            --manifest "${{ inputs.manifest_path }}" \
            --output "$GITHUB_WORKSPACE/tools/part-vectorizer-v2/manual-output" \
            "${EXTRA[@]}"
      - name: Upload vectorizer fixture audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-vectorizer-v2-audit
          path: |
            tools/part-vectorizer-v2/test/output/
            tools/part-vectorizer-v2/manual-output/
            tools/part-vectorizer-v2/package-lock.json
          if-no-files-found: warn
