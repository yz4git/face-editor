name: Face Editor Visual Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  canvas2d-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm install
      - run: npm run build
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/face-editor-preview.log 2>&1 &
          echo $! > /tmp/face-editor-preview.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/face-editor-preview.log
          exit 1
      - name: Run Canvas2D visual audit
        run: npx playwright test visual-audit/visual-audit.spec.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: face-editor-visual-audit
          path: visual-audit/output/
          if-no-files-found: warn
